name: offline checks

on:
  push:
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Schedule logic, search, hours guard, and SMS tidy. No AWS credentials needed.
      - run: python eval/run_eval.py
        env:
          FRESHTRACK_OFFLINE: "1"
      - run: python -m py_compile freshtrack_agent/*.py lambda/nearest.py
